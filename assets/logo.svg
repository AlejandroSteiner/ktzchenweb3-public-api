<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#mainGradient)" opacity="0.1"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#mainGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Hexagon network pattern (Web3 symbol) -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Central hexagon -->
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" 
             fill="none" stroke="url(#mainGradient)" stroke-width="3"/>
    
    <!-- Inner connections -->
    <circle cx="0" cy="-40" r="6" fill="url(#accentGradient)"/>
    <circle cx="35" cy="-20" r="6" fill="url(#accentGradient)"/>
    <circle cx="35" cy="20" r="6" fill="url(#accentGradient)"/>
    <circle cx="0" cy="40" r="6" fill="url(#accentGradient)"/>
    <circle cx="-35" cy="20" r="6" fill="url(#accentGradient)"/>
    <circle cx="-35" cy="-20" r="6" fill="url(#accentGradient)"/>
    
    <!-- Center node -->
    <circle cx="0" cy="0" r="12" fill="url(#mainGradient)"/>
    <circle cx="0" cy="0" r="8" fill="#fff"/>
    
    <!-- Connection lines from center -->
    <line x1="0" y1="0" x2="0" y2="-40" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="35" y2="-20" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="35" y2="20" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="-35" y2="20" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="-35" y2="-20" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Outer orbit ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#mainGradient)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>
  
  <!-- Orbiting nodes -->
  <circle cx="100" cy="30" r="4" fill="url(#accentGradient)"/>
  <circle cx="170" cy="100" r="4" fill="url(#accentGradient)"/>
  <circle cx="100" cy="170" r="4" fill="url(#accentGradient)"/>
  <circle cx="30" cy="100" r="4" fill="url(#accentGradient)"/>
</svg>
